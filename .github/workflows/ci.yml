name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openslide-tools libopenslide0 libgl1

      - name: Install PyTorch (CPU)
        run: |
          pip install 'setuptools<82'
          pip install 'numpy<2'
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install Detectron2 (CPU)
        run: |
          pip install --no-build-isolation 'git+https://github.com/facebookresearch/detectron2.git'

      - name: Install AdiFind
        run: |
          pip install -e ".[dev]"

      - name: Run smoke tests
        run: |
          python -m pytest -p no:debugging code/test_smoke.py -v --tb=short -x

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build -t adifind:gpu -f docker/Dockerfile .
          docker build -t adifind:cpu -f docker/Dockerfile.cpu .

      - name: Verify container help commands
        run: |
          docker run --rm adifind:gpu --help
          docker run --rm adifind:cpu --help
          docker run --rm --entrypoint python adifind:gpu -c "import numpy, torch, openslide; print(numpy.__version__); print(torch.__version__); print(openslide.__library_version__)"
          docker run --rm --entrypoint python -v ${{ github.workspace }}/example_data:/data/input:ro adifind:gpu -c "import openslide; slide = openslide.OpenSlide('/data/input/K106942.svs'); print(slide.dimensions); slide.close()"
          docker run --rm --entrypoint python adifind:cpu -c "import numpy, torch, openslide; print(numpy.__version__); print(torch.__version__); print(openslide.__library_version__)"
          docker run --rm --entrypoint python -v ${{ github.workspace }}/example_data:/data/input:ro adifind:cpu -c "import openslide; slide = openslide.OpenSlide('/data/input/K106942.svs'); print(slide.dimensions); slide.close()"
          docker run --rm --entrypoint python adifind:gpu -c "from pathlib import Path; from detectron2.config import get_cfg; from model_registry import merge_detectron2_builtin_config; cfg = get_cfg(); config_path = Path(merge_detectron2_builtin_config(cfg)); normalized = str(config_path).replace(chr(92), '/'); assert config_path.is_file(); assert 'detectron2/model_zoo/configs' in normalized; assert cfg.MODEL.META_ARCHITECTURE == 'GeneralizedRCNN'; assert cfg.MODEL.MASK_ON is True; print(config_path)"
          docker run --rm --entrypoint python adifind:cpu -c "from pathlib import Path; from detectron2.config import get_cfg; from model_registry import merge_detectron2_builtin_config; cfg = get_cfg(); config_path = Path(merge_detectron2_builtin_config(cfg)); normalized = str(config_path).replace(chr(92), '/'); assert config_path.is_file(); assert 'detectron2/model_zoo/configs' in normalized; assert cfg.MODEL.META_ARCHITECTURE == 'GeneralizedRCNN'; assert cfg.MODEL.MASK_ON is True; print(config_path)"
