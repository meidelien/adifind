# AdiFind Conda Environment
# Install: conda env create -f environment.yml
# Activate: conda activate adifind
name: adifind
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # PyTorch with CUDA (conda handles CUDA toolkit automatically)
  - pytorch>=2.0
  - torchvision>=0.15
  - pytorch-cuda=12.1
  # OpenSlide (C library + Python bindings via conda-forge)
  - openslide-python
  # Scientific computing
  - numpy>=1.21
  - scipy>=1.7
  - pandas>=1.3
  - scikit-image>=0.19
  # Image processing
  - opencv
  - pillow>=9.0
  - tifffile
  - matplotlib>=3.5
  - tqdm>=4.62
  # Jupyter notebook support
  - jupyter
  - ipywidgets>=8.0
  # pip-only packages
  - pip
  # Detectron2 and some legacy dependencies still expect pkg_resources.
  - setuptools<82
  - pip:
    # Detectron2 (built from source via pip)
    - "git+https://github.com/facebookresearch/detectron2.git"
    # HuggingFace Hub for model downloading
    - "huggingface-hub>=0.20.0"
    # Install AdiFind itself in editable mode
    - "-e ."
